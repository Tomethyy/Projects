services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shift
      POSTGRES_PASSWORD: shift_dev_change_me
      POSTGRES_DB: shiftengine
    ports:
      - "5432:5432"
    volumes:
      - shift_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=shiftengine;Username=shift;Password=shift_dev_change_me
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  shift_pg:
