name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shift
          POSTGRES_PASSWORD: shift_dev_change_me
          POSTGRES_DB: shiftengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal
      - name: EF verify
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project src/ShiftEngine.Infrastructure --startup-project src/ShiftEngine.Api --connection "Host=localhost;Port=5432;Database=shiftengine;Username=shift;Password=shift_dev_change_me"
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=shiftengine;Username=shift;Password=shift_dev_change_me
